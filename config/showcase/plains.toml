# Showcase video for judging a detector: every mob, in groups at fresh random spots, filmed
# by a slow camera flight from high above, on superflat plains at noon. Used by
# `mobdataset showcase`.

seed = 7
groups = ["hostile", "neutral", "passive"]
fps = 30

[stage]
# Away from the capture areas (x 0..1800), so nothing left over from captures shows up.
origin_x = -800
origin_z = 0
ground_y = -60
clusters = 6
# Cluster centres sit on a circle this far from the origin.
ring = 36.0
# Mobs stand within this many blocks of their cluster centre, this far apart at least.
cluster_radius = 9.0
min_gap = 2.2
min_gap_large = 4.5

[flight]
# Slow pace: the camera turns about 12-20 degrees per second.
# 1) High orbit over everything (turn is the share of a full circle).
overview_radius = 75.0
overview_height = 40.0
overview_seconds = 30.0
overview_turn = 1.0
# 2) A closer orbit above each cluster in turn.
cluster_orbit_radius = 13.0
cluster_orbit_height = 7.0
cluster_seconds = 12.0
cluster_turn = 0.75
# Eased glides between orbits, no faster than this on average (blocks/s, degrees/s).
glide_speed = 6.0
glide_turn_rate = 15.0
glide_min_seconds = 2.0
# Camera updates per second; matches fps so every video frame gets a fresh pose.
hz = 30
