# Random visible states for summoned mobs, Minecraft Java 1.21.11.
# Keys and value formats come from the decompiled 1.21.11 source (Mojang names) and the
# server jar's data registries; "src:" names the class whose load method reads the key.
#
# Why this matters: `summon <id> <pos> <nbt>` with an NBT argument skips finalizeSpawn
# (SummonCommand#createEntity). So no natural defaults are applied: no skeleton bow, no
# random sheep colour, no biome variant, no armour, no jockeys. Everything natural must
# come from this file.
#
# Format
#   [meta]                   no_states: mobs with nothing useful to vary.
#   [templates.<name>]       generators referenced by features (armour sets).
#   [general.<feature>]      applies to every mob except those in `except`.
#   [<mob>.<feature>]        one independent feature of that mob (id without "minecraft:").
#   [riders.<name>]          vehicle + passenger combos.
#
# Feature keys
#   chance       probability the feature is applied; rolled independently, in file order.
#   nbt          alternatives; one is picked and added inside summon's {...}.
#   equip        alternatives instead of nbt; each maps slot -> item SNBT. All picked items
#                are merged into one equipment:{...} compound. Slots: mainhand, offhand,
#                head, chest, legs, feet, body, saddle (EquipmentSlot).
#   weights      optional, same length as nbt/equip; default uniform.
#   also         fixed snippet added whenever the feature applies (dedupe identical ones).
#   unless       feature names of the same mob; skip if any of them was applied.
#   requires     feature names of the same mob; skip unless all of them were applied.
#   merge_into   the picked nbt value is not a snippet but a field value, written into the
#                named compound field of an earlier snippet (VillagerData.profession takes
#                "minecraft:<value>", VillagerData.level the bare int).
#   template     name of a [templates.*] entry that generates the equip instead.
#   command      run after the summon instead of NBT; {target} = selector for that mob.
#   needs_ticks  only shows after this many ticks (`tick step N`): the synced flag or the
#                client animation is set in tick(), which a frozen world never runs.
#                Running ticks in daylight also sets bare-headed undead on fire.
#   verify       key or effect not yet confirmed in game.
#   except       ([general] only) mobs the feature never applies to.
# Placeholder: {player_uuid} = UUID int array of the camera player, e.g. [I;1,2,3,4].

[meta]
no_states = [
  "breeze", "cave_spider", "cod", "creaking", "elder_guardian", "ender_dragon",
  "endermite", "guardian", "ravager", "silverfish", "spider", "tadpole",
  "wandering_trader", "warden",
]
# spider, cave_spider and ravager still get riders, see [riders].

# Mob#populateDefaultEquipmentSlots: one material for the whole set, filled head -> feet,
# stopping before each further piece with stop_chance (0.25 on normal). Material odds are
# the game's (rand(3) + 3 x 10.87 % upgrades), with iron/diamond raised for coverage.
[templates.armour]
materials = ["leather", "copper", "golden", "chainmail", "iron", "diamond"]
material_weights = [24, 30, 30, 10, 5, 1]
slots = ["head", "chest", "legs", "feet"]
items = { head = "helmet", chest = "chestplate", legs = "leggings", feet = "boots" }
stop_chance = 0.25
# item id = "minecraft:<material>_<items[slot]>"

# ---------------------------------------------------------------- general

[general.on_fire]
# Burning flames. HasVisualFire avoids fire damage; the shared on-fire flag is only set in
# Entity#baseTick, and the client hides fire on fire-immune types (Entity#isOnFire).
chance = 0.04
nbt = ['HasVisualFire:1b']
needs_ticks = 1
verify = true
except = [
  "blaze", "ender_dragon", "ghast", "magma_cube", "shulker", "strider", "vex", "warden",
  "wither", "wither_skeleton", "zoglin", "zombified_piglin", "mannequin", "armor_stand",
  "axolotl", "cod", "dolphin", "elder_guardian", "glow_squid", "guardian", "nautilus",
  "pufferfish", "salmon", "squid", "tadpole", "tropical_fish", "zombie_nautilus",
]

[general.hurt_flash]
# Red hurt tint. HurtTime NBT is server-only; the client tint comes from the damage event
# and hurtTime only counts down in LivingEntity#baseTick, so it stays while frozen.
chance = 0.04
command = "damage {target} 1"
verify = true
except = ["ender_dragon", "wither", "mannequin", "armor_stand"]

