# ---------------------------------------------------------------- riders
# chance: per summon of the vehicle. vehicle_nbt / vehicle_equip are forced on the vehicle,
# skip lists vehicle features not to roll. alternatives: lists of passengers, one list
# picked (by weights). Each passenger {id, nbt, equip, roll_states} becomes an entry in
# Passengers:[{id:"minecraft:<id>",...}] and also needs the base NBT (NoAI, Silent, Tags);
# roll_states = true rolls its own features too. The first passenger sits in front.

[riders.chicken_jockey]
# Zombie#finalizeSpawn: baby zombie on a chicken, IsChickenJockey on the chicken.
vehicle = "chicken"
chance = 0.03
vehicle_nbt = 'IsChickenJockey:1b'
skip = ["baby"]
alternatives = [
  [{ id = "zombie", nbt = 'IsBaby:1b', roll_states = true }],
  [{ id = "husk", nbt = 'IsBaby:1b', roll_states = true }],
  [{ id = "drowned", nbt = 'IsBaby:1b', roll_states = true }],
  [{ id = "zombie_villager", nbt = 'IsBaby:1b', roll_states = true }],
  [{ id = "zombified_piglin", nbt = 'IsBaby:1b', roll_states = true }],
]
weights = [6, 2, 1, 1, 1]

