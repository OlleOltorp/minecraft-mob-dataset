# ---------------------------------------------------------------- action looks
# Looks a mob only has mid-fight. Their synced flags are set by AI goals and never saved, so
# summon NBT can't reach them; the mobcapture mod (installed on the server) reads these extra
# keys on load and sets the flag (NaturalLookMixin). Vanilla ignores the keys. Shows at once,
# no ticks needed.
#   mobcapture_aggressive:1b  Mob#setAggressive: zombie arms up, bow drawn, weapon raised.
#   mobcapture_charging:1b    the mob's attack flag (blaze flames, ghast face, vex, pillager).
#   mobcapture_spell:<id>b    SpellcasterIllager casting pose; ids from IllagerSpell.
# chance = share of sightings where the mob is fighting x share of a fight in that look,
# from the goal timings in the source. Seen from high above, mobs are mostly going about
# their business, so fighting is taken as ~20 % for common hostiles, more where mobs are
# usually met in fights (fortress, mansion, raid) and 100 % for vexes, which only exist in
# fights.

[blaze.flames]
# BlazeAttackGoal: charged 78 of every 178 ticks (44 %) in a fight; fighting ~55 % (they
# engage from 48 blocks, and fortress halls keep them in sight of players).
chance = 0.25
nbt = ['mobcapture_charging:1b']

[ghast.shooting]
# GhastShootFireballGoal: face lit 10 of every 60 ticks (17 %); fighting ~40 %.
chance = 0.07
nbt = ['mobcapture_charging:1b']

[vex.charging]
# VexChargeAttackGoal: red charge texture for ~35 % of a fight; vexes only appear in fights.
chance = 0.35
nbt = ['mobcapture_charging:1b']

[pillager.charging]
# RangedCrossbowAttackGoal: charging 25 of ~55 ticks (45 %); fighting ~25 %. Arms take the
# charging pose; the string stays slack, since that needs the item in use over ticks.
chance = 0.12
nbt = ['mobcapture_charging:1b']

[evoker.casting]
# Fangs 40 of 100 ticks, vexes 100 of 340: casting ~45 % of a fight; fighting ~45 %
# (mansions and raids). Arms raised; spells differ only in particle colour, and particles
# don't move in a frozen world, so one spell (fangs) stands for all.
chance = 0.2
nbt = ['mobcapture_spell:2b']

[vindicator.aggressive]
# Axe and raised arms only while aggressive, i.e. the whole time it has a target; fighting
# ~40 % (raids, mansions).
chance = 0.4
nbt = ['mobcapture_aggressive:1b']

[zombie.aggressive]
# Arms raised the whole time it chases a target; chasing ~20 %.
chance = 0.2
nbt = ['mobcapture_aggressive:1b']

[husk.aggressive]
chance = 0.2
nbt = ['mobcapture_aggressive:1b']

